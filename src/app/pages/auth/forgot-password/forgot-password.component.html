<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .fb-auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .fb-card {
      width: 100%;
      max-width: 430px;
      border-radius: 16px;
      border-top: 4px solid transparent;
      border-image: linear-gradient(to right, #7928ca, #ff0080, #04e09a, #e0d504) 1;
      border-image-slice: 1;
      overflow: hidden;
    }
    .fb-card-inner {
      background-image: linear-gradient(127.09deg, rgba(6, 11, 40, 0.94) 19.41%, rgba(10, 14, 35, 0.49) 76.65%);
      background-color: var(--bs-card-bg, #070c29);
      backdrop-filter: blur(12px);
      padding: 40px 34px 34px;
      border-radius: 0 0 16px 16px;
    }

    .fb-logo { text-align: center; margin-bottom: 24px; }
    .fb-logo img { width: 68px; height: 68px; object-fit: contain; border-radius: 50%; background: #fff; padding: 4px; box-shadow: 0 6px 20px rgba(55,124,244,0.18); }

    .fb-lock-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(55,124,244,0.15);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .fb-lock-icon .material-icons-outlined { font-size: 28px; color: #2E3F8F; }

    .fb-title { text-align: center; font-size: 18px; font-weight: 600; color: var(--bs-heading-color, #e6ecf0); margin-bottom: 8px; }
    .fb-subtitle { text-align: center; font-size: 13.5px; color: rgba(255,255,255,0.5); margin-bottom: 28px; line-height: 1.5; }

    .fb-field { margin-bottom: 20px; }
    .fb-field label { display: block; font-size: 13px; font-weight: 600; color: var(--bs-body-color, #d3d7dc); margin-bottom: 7px; }

    .fb-input {
      display: flex; align-items: center; width: 100%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 0 14px; height: 46px; overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fb-input:focus-within { border-color: #2E3F8F; box-shadow: 0 0 0 3px rgba(55,124,244,0.15); background: rgba(255,255,255,0.08); }
    .fb-input .icon { color: rgba(255,255,255,0.4); font-size: 20px; flex-shrink: 0; margin-right: 10px; }
    .fb-input input,
    .fb-input input[type="text"] {
      flex: 1 1 0 !important; min-width: 0 !important; width: 0 !important;
      border: none !important; background: none !important; outline: none !important;
      box-shadow: none !important; padding: 0 !important;
      font-size: 14px; font-family: 'Noto Sans', sans-serif; color: #e6ecf0; height: 100%;
      overflow: hidden; text-overflow: ellipsis;
    }
    .fb-input input::placeholder { color: rgba(255,255,255,0.3) !important; }
    [data-bs-theme="light"] .fb-input input,
    [data-bs-theme="bodered-theme"] .fb-input input { color: #000 !important; }
    [data-bs-theme="light"] .fb-input input::placeholder,
    [data-bs-theme="bodered-theme"] .fb-input input::placeholder { color: rgba(0,0,0,0.4) !important; opacity: 1 !important; }

    .fb-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 48px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #377CF4, #2E3F8F); color: #fff;
      font-size: 15px; font-weight: 600; font-family: 'Noto Sans', sans-serif;
      cursor: pointer; box-shadow: 0 4px 14px rgba(55,124,244,0.3); margin-bottom: 12px;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .fb-btn:hover { box-shadow: 0 6px 20px rgba(55,124,244,0.4); transform: translateY(-1px); }
    .fb-btn:active { transform: translateY(0); }

    .fb-btn-back {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; height: 46px;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      background: transparent; color: rgba(255,255,255,0.6);
      font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s;
    }
    .fb-btn-back:hover { background: rgba(255,255,255,0.05); color: #e6ecf0; }
    .fb-btn-back .material-icons-outlined { font-size: 18px; }

    &#64;media (max-width: 480px) {
      .fb-card-inner { padding: 30px 22px 26px; }
      .fb-title { font-size: 16px; }
    }
  </style>


  <div class="fb-auth-page">
    <div style="position: fixed; top: 18px; right: 18px; z-index: 1050;">
      <app-theme-switcher></app-theme-switcher>
    </div>

    <div class="fb-card">
      <div class="fb-card-inner">

        <div class="fb-logo">
          <img src="/assets/images/app-logo.jpeg" alt="FamilyBalance">
        </div>

        <div class="fb-lock-icon">
          <span class="material-icons-outlined">lock_reset</span>
        </div>

        <h4 class="fb-title">Mot de passe oublié ?</h4>
        <p class="fb-subtitle">Entrez votre numéro de téléphone pour recevoir un code de réinitialisation</p>

        <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
          <div class="fb-field">
            <label for="inputPhone">Numéro de téléphone</label>
            <div class="fb-input">
              <span class="material-icons-outlined icon">phone</span>
              <input type="tel" id="inputPhone" name="phoneNumber"
                     [(ngModel)]="phoneNumber" placeholder="Ex: 98123456"
                     inputmode="numeric" maxlength="8" pattern="\d*"
                     (input)="onPhoneInput($event)" required>
            </div>
          </div>

          <div *ngIf="errorMsg" class="alert alert-danger py-2 mb-3" role="alert"
               style="font-size:13px;border-radius:10px;">{{ errorMsg }}</div>
          <div *ngIf="infoMsg" class="alert alert-success py-2 mb-3" role="alert"
               style="font-size:13px;border-radius:10px;">{{ infoMsg }}</div>

          <button type="submit" class="fb-btn" [disabled]="submitting">
            {{ submitting ? 'Envoi…' : 'Envoyer le code' }}
          </button>
          <a routerLink="/auth/login" class="fb-btn-back">
            <span class="material-icons-outlined">arrow_back</span>
            Retour à la connexion
          </a>
        </form>

      </div>
    </div>
  </div>
