<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .fb-auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .fb-card {
      width: 100%;
      max-width: 430px;
      border-radius: 16px;
      border-top: 4px solid transparent;
      border-image: linear-gradient(to right, #7928ca, #ff0080, #04e09a, #e0d504) 1;
      border-image-slice: 1;
      overflow: hidden;
    }
    .fb-card-inner {
      background-image: linear-gradient(127.09deg, rgba(6, 11, 40, 0.94) 19.41%, rgba(10, 14, 35, 0.49) 76.65%);
      background-color: var(--bs-card-bg, #070c29);
      backdrop-filter: blur(12px);
      padding: 40px 34px 34px;
      border-radius: 0 0 16px 16px;
    }

    .fb-logo { text-align: center; margin-bottom: 24px; }
    .fb-logo img { width: 68px; height: 68px; object-fit: contain; border-radius: 50%; background: #fff; padding: 4px; box-shadow: 0 6px 20px rgba(55,124,244,0.18); }

    .fb-lock-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(22,163,74,0.15);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .fb-lock-icon .material-icons-outlined { font-size: 28px; color: #22c55e; }

    .fb-title { text-align: center; font-size: 18px; font-weight: 600; color: var(--bs-heading-color, #e6ecf0); margin-bottom: 8px; }
    .fb-subtitle { text-align: center; font-size: 13.5px; color: rgba(255,255,255,0.5); margin-bottom: 28px; line-height: 1.5; }

    .fb-field { margin-bottom: 20px; }
    .fb-field label { display: block; font-size: 13px; font-weight: 600; color: var(--bs-body-color, #d3d7dc); margin-bottom: 7px; }

    /* ── Input wrapper ──
       Absolute-positioned icon + absolute-positioned eye button.
       Input fills 100 % width with explicit left/right padding. No flex
       sizing, no `width:0` tricks — guarantees the password placeholder
       starts flush against the lock icon, identical to the text input. */
    .fb-input {
      position: relative;
      width: 100%;
      height: 46px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fb-input:focus-within {
      border-color: #2E3F8F;
      box-shadow: 0 0 0 3px rgba(55,124,244, 0.15);
      background: rgba(255, 255, 255, 0.08);
    }
    .fb-input .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      line-height: 1;
    }
    .fb-input input {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0 14px 0 44px;
      border: 0;
      background: transparent;
      outline: none;
      box-shadow: none;
      font-size: 14px;
      font-family: 'Noto Sans', sans-serif;
      color: #e6ecf0;
      border-radius: 10px;
      text-align: left;
    }
    .fb-input input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    [data-bs-theme="light"] .fb-input input,
    [data-bs-theme="bodered-theme"] .fb-input input { color: #000 !important; }
    [data-bs-theme="light"] .fb-input input::placeholder,
    [data-bs-theme="bodered-theme"] .fb-input input::placeholder { color: rgba(0,0,0,0.4) !important; opacity: 1 !important; }
    .fb-input.with-eye input { padding-right: 44px; }
    .fb-input .btn-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .fb-input .btn-eye:hover { color: #2E3F8F; }

    /* Neutralise Chrome autofill + hide browser-injected password decorations */
    .fb-input input:-webkit-autofill,
    .fb-input input:-webkit-autofill:hover,
    .fb-input input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e6ecf0 !important;
      -webkit-box-shadow: 0 0 0 40px transparent inset !important;
      caret-color: #e6ecf0;
      transition: background-color 5000s ease-in-out 0s;
    }
    .fb-input input[type="password"]::-webkit-credentials-auto-fill-button,
    .fb-input input[type="password"]::-webkit-strong-password-auto-fill-button,
    .fb-input input[type="password"]::-webkit-contacts-auto-fill-button {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .fb-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 48px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #377CF4, #2E3F8F); color: #fff;
      font-size: 15px; font-weight: 600; font-family: 'Noto Sans', sans-serif;
      cursor: pointer; box-shadow: 0 4px 14px rgba(55,124,244,0.3); margin-bottom: 12px;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .fb-btn:hover { box-shadow: 0 6px 20px rgba(55,124,244,0.4); transform: translateY(-1px); }
    .fb-btn:active { transform: translateY(0); }
    .fb-btn .material-icons-outlined { font-size: 20px; }

    .fb-btn-back {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; height: 46px;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      background: transparent; color: rgba(255,255,255,0.6);
      font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s;
    }
    .fb-btn-back:hover { background: rgba(255,255,255,0.05); color: #e6ecf0; }
    .fb-btn-back .material-icons-outlined { font-size: 18px; }

    &#64;media (max-width: 480px) {
      .fb-card-inner { padding: 30px 22px 26px; }
      .fb-title { font-size: 16px; }
    }
  </style>


  <div class="fb-auth-page">
    <div style="position: fixed; top: 18px; right: 18px; z-index: 1050;">
      <app-theme-switcher></app-theme-switcher>
    </div>

    <div class="fb-card">
      <div class="fb-card-inner">

        <div class="fb-logo">
          <img src="/assets/images/app-logo.jpeg" alt="FamilyBalance">
        </div>

        <div class="fb-lock-icon">
          <span class="material-icons-outlined">vpn_key</span>
        </div>

        <h4 class="fb-title">Nouveau mot de passe</h4>
        <p class="fb-subtitle">
          <ng-container *ngIf="phone; else noPhone">Un code a été envoyé au {{ phone }}.</ng-container>
          <ng-template #noPhone>Saisissez le code reçu par SMS puis votre nouveau mot de passe.</ng-template>
        </p>

        <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
          <div class="fb-field">
            <label for="inputCode">Code de vérification</label>
            <div class="fb-input">
              <span class="material-icons-outlined icon">pin</span>
              <input type="text" id="inputCode" name="code" [(ngModel)]="code"
                     placeholder="4 chiffres" inputmode="numeric" maxlength="6" required>
            </div>
          </div>

          <div class="fb-field">
            <label for="newPassword">Nouveau mot de passe</label>
            <div class="fb-input with-eye" id="pwd1Wrap">
              <span class="material-icons-outlined icon">lock_outline</span>
              <input type="password" id="newPassword" name="newPassword"
                     [(ngModel)]="newPassword" placeholder="Entrez votre nouveau mot de passe" required>
              <button type="button" class="btn-eye" (click)="togglePwd('newPassword', $any($event.currentTarget))" aria-label="Afficher le mot de passe">
                <span class="material-icons-outlined">visibility_off</span>
              </button>
            </div>
          </div>

          <div class="fb-field">
            <label for="confirmPassword">Confirmer le mot de passe</label>
            <div class="fb-input with-eye" id="pwd2Wrap">
              <span class="material-icons-outlined icon">lock_outline</span>
              <input type="password" id="confirmPassword" name="confirmPassword"
                     [(ngModel)]="confirmPassword" placeholder="Confirmez votre mot de passe" required>
              <button type="button" class="btn-eye" (click)="togglePwd('confirmPassword', $any($event.currentTarget))" aria-label="Afficher le mot de passe">
                <span class="material-icons-outlined">visibility_off</span>
              </button>
            </div>
          </div>

          <div *ngIf="errorMsg" class="alert alert-danger py-2 mb-3" role="alert"
               style="font-size:13px;border-radius:10px;">{{ errorMsg }}</div>
          <div *ngIf="infoMsg" class="alert alert-success py-2 mb-3" role="alert"
               style="font-size:13px;border-radius:10px;">{{ infoMsg }}</div>

          <button type="submit" class="fb-btn" style="margin-top: 6px;" [disabled]="submitting">
            <span class="material-icons-outlined">{{ submitting ? 'hourglass_top' : 'check_circle' }}</span>
            {{ submitting ? 'Enregistrement…' : 'Changer le mot de passe' }}
          </button>
          <a routerLink="/auth/login" class="fb-btn-back">
            <span class="material-icons-outlined">arrow_back</span>
            Retour à la connexion
          </a>
        </form>

      </div>
    </div>
  </div>
