<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .fb-auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Card ── */
    .fb-card {
      position: relative;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      overflow: hidden;
    }
    /* Gradient accent on top only — replaces the previous `border-image`
       which sometimes bled onto other edges in Chromium. */
    .fb-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(to right, #7928ca, #ff0080, #04e09a, #e0d504);
      z-index: 2;
    }
    .fb-card-inner {
      background-image: linear-gradient(127.09deg, rgba(6, 11, 40, 0.94) 19.41%, rgba(10, 14, 35, 0.49) 76.65%);
      background-color: var(--bs-card-bg, #070c29);
      backdrop-filter: blur(12px);
      padding: 36px 32px 32px;
      border-radius: 0 0 16px 16px;
    }

    /* ── Logo ── */
    .fb-logo { text-align: center; margin-bottom: 20px; }
    .fb-logo img { width: 56px; height: 56px; object-fit: contain; border-radius: 50%; background: #fff; padding: 3px; box-shadow: 0 6px 20px rgba(55,124,244,0.18); }

    /* ── Title ── */
    .fb-title {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--bs-heading-color, #e6ecf0);
      margin-bottom: 24px;
    }

    /* ── Step indicator ── */
    .fb-stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
    .fb-step { display: flex; align-items: center; gap: 8px; }
    .fb-step-circle {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .fb-step.active .fb-step-circle {
      background: linear-gradient(135deg, #377CF4, #2E3F8F);
      color: #fff; box-shadow: 0 2px 8px rgba(55,124,244,0.3);
    }
    .fb-step.inactive .fb-step-circle { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.35); }
    .fb-step.completed .fb-step-circle { background: #16a34a; color: #fff; }
    .fb-step-label { font-size: 13px; font-weight: 600; }
    .fb-step.active .fb-step-label { color: #e6ecf0; }
    .fb-step.inactive .fb-step-label { color: rgba(255,255,255,0.35); }
    .fb-step.completed .fb-step-label { color: #22c55e; }
    .fb-step-line { width: 50px; height: 2px; background: rgba(255,255,255,0.15); margin: 0 12px; flex-shrink: 0; }
    .fb-step-line.done { background: #16a34a; }

    /* ── Section ── */
    .fb-section-title { font-size: 15px; font-weight: 700; color: var(--bs-heading-color, #e6ecf0); margin-bottom: 4px; }
    .fb-section-desc { font-size: 12.5px; color: rgba(255,255,255,0.45); margin-bottom: 22px; }

    /* ── Form field ── */
    .fb-field { margin-bottom: 16px; }
    .fb-field label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--bs-body-color, #d3d7dc); margin-bottom: 6px;
    }

    /* ── Input ── */
    .fb-input {
      display: flex; align-items: center; width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 0 14px; height: 44px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fb-input:focus-within {
      border-color: #2E3F8F;
      box-shadow: 0 0 0 3px rgba(55,124,244,0.15);
      background: rgba(255,255,255,0.08);
    }
    .fb-input .icon { color: rgba(255,255,255,0.4); font-size: 19px; flex-shrink: 0; margin-right: 10px; }
    .fb-input input,
    .fb-input input[type="text"],
    .fb-input input[type="password"],
    .fb-input input[type="tel"] {
      flex: 1 1 0 !important; min-width: 0 !important; width: 0 !important;
      border: none !important; background: none !important; outline: none !important;
      box-shadow: none !important; padding: 0 !important;
      font-size: 13.5px; font-family: 'Noto Sans', sans-serif; color: #e6ecf0; height: 100%;
      overflow: hidden; text-overflow: ellipsis;
    }
    .fb-input input::placeholder { color: rgba(255,255,255,0.3) !important; }
    /* Theme clair / bordered : placeholder sombre lisible sur fond blanc. */
    [data-bs-theme="light"] .fb-input input,
    [data-bs-theme="bodered-theme"] .fb-input input { color: #000 !important; }
    [data-bs-theme="light"] .fb-input input::placeholder,
    [data-bs-theme="bodered-theme"] .fb-input input::placeholder { color: rgba(0,0,0,0.4) !important; opacity: 1 !important; }
    .fb-input input[readonly] { opacity: 0.6; }
    .fb-input .btn-eye {
      background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer;
      padding: 0; flex-shrink: 0; margin-left: 8px; display: flex; align-items: center; font-size: 20px;
    }
    .fb-input .btn-eye:hover { color: #2E3F8F; }

    /* ── Row ── */
    .fb-row { display: flex; gap: 12px; }
    .fb-row .fb-field { flex: 1; }

    /* ── Phone ── */
    .fb-phone-row { display: flex; gap: 8px; align-items: flex-end; }
    .fb-phone-prefix {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 0 14px; height: 44px; display: flex; align-items: center;
      font-size: 13.5px; font-weight: 600; color: #d3d7dc; white-space: nowrap; flex-shrink: 0;
    }
    .fb-phone-row .fb-field { flex: 1; margin-bottom: 0; }
    .fb-btn-verify {
      height: 44px; padding: 0 16px; border: none; border-radius: 10px;
      background: rgba(55,124,244,0.2); color: #60a5fa; font-size: 12.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.2s;
    }
    .fb-btn-verify:hover { background: rgba(55,124,244,0.35); }

    /* ── Strength ── */
    .fb-strength-bar { height: 3px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .fb-strength-bar .bar-fill { height: 100%; width: 0%; border-radius: 3px; transition: width 0.3s, background 0.3s; }
    .fb-strength-text { font-size: 11px; margin-top: 4px; font-weight: 500; }

    /* ── Button ── */
    .fb-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 46px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #377CF4, #2E3F8F); color: #fff;
      font-size: 15px; font-weight: 600; font-family: 'Noto Sans', sans-serif;
      cursor: pointer; box-shadow: 0 4px 14px rgba(55,124,244,0.3); margin-top: 24px;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .fb-btn:hover { box-shadow: 0 6px 20px rgba(55,124,244,0.4); transform: translateY(-1px); background: linear-gradient(135deg, #2E6BE0, #26336F); }
    .fb-btn:active { transform: translateY(0); }

    /* ── Footer ── */
    .fb-footer { text-align: center; margin-top: 20px; font-size: 13.5px; color: rgba(255,255,255,0.5); }
    .fb-footer a { color: #2E3F8F; font-weight: 600; text-decoration: none; }
    .fb-footer a:hover { text-decoration: underline; color: #60a5fa; }

    /* ── Responsive ── */
    &#64;media (max-width: 480px) {
      .fb-card-inner { padding: 28px 20px 24px; }
      .fb-title { font-size: 16px; }
      .fb-row { flex-direction: column; gap: 0; }
      .fb-phone-row { flex-wrap: wrap; }
      .fb-step-line { width: 30px; margin: 0 6px; }
    }
  </style>


  <div class="fb-auth-page">
    <!-- Sélecteur de thème — partagé avec les autres pages d'auth via
         localStorage['fb-theme'] / data-bs-theme. -->
    <div style="position: fixed; top: 18px; right: 18px; z-index: 1050;">
      <app-theme-switcher></app-theme-switcher>
    </div>

    <div class="fb-card">
      <div class="fb-card-inner">

        <!-- Logo -->
        <div class="fb-logo">
          <img src="/assets/images/app-logo.jpeg" alt="FamilyBalance">
        </div>

        <h4 class="fb-title">Créez votre espace familial</h4>

        <!-- Stepper -->
        <div class="fb-stepper">
          <div class="fb-step active">
            <div class="fb-step-circle">1</div>
            <span class="fb-step-label">La famille</span>
          </div>
          <div class="fb-step-line"></div>
          <div class="fb-step inactive">
            <div class="fb-step-circle">2</div>
            <span class="fb-step-label">Les membres</span>
          </div>
        </div>

        <div class="fb-section-title">Administrateur de la famille</div>
        <div class="fb-section-desc">Ces informations servent à créer votre compte principal</div>

        <!-- Form -->
        <form id="registerForm" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
          <div class="fb-field">
            <label>Nom de la famille</label>
            <div class="fb-input">
              <span class="material-icons-outlined icon">home</span>
              <input type="text" id="inputFamilyName" name="familyName"
                     [(ngModel)]="familyName" placeholder="Entrez le nom de la famille" required>
            </div>
          </div>

          <div class="fb-row">
            <div class="fb-field">
              <label>Prénom</label>
              <div class="fb-input">
                <span class="material-icons-outlined icon">person</span>
                <input type="text" id="inputFirstName" name="firstName"
                       [(ngModel)]="firstName" (ngModelChange)="syncUsername()"
                       placeholder="Entrez votre prénom" required>
              </div>
            </div>
            <div class="fb-field">
              <label>Nom</label>
              <div class="fb-input">
                <span class="material-icons-outlined icon">badge</span>
                <input type="text" id="inputLastName" name="lastName"
                       [(ngModel)]="lastName" (ngModelChange)="syncUsername()"
                       placeholder="Entrez votre nom" required>
              </div>
            </div>
          </div>

          <div class="fb-field">
            <label>Mot de passe</label>
            <div class="fb-input" id="pwdWrap">
              <span class="material-icons-outlined icon">lock</span>
              <input type="password" id="inputPassword" name="password"
                     [(ngModel)]="password" placeholder="Minimum 8 caractères" required>
              <button type="button" class="btn-eye" id="togglePwd">
                <span class="material-icons-outlined">visibility_off</span>
              </button>
            </div>
            <div class="fb-strength-bar"><div class="bar-fill" id="strengthFill"></div></div>
            <div class="fb-strength-text" id="strengthText"></div>
          </div>

          <div class="fb-field" style="margin-bottom:0">
            <label>Numéro de téléphone</label>
            <div class="fb-phone-row">
              <div class="fb-phone-prefix">+216</div>
              <div class="fb-field" style="margin-bottom:0">
                <div class="fb-input">
                  <span class="material-icons-outlined icon">phone</span>
                  <input type="tel" id="inputPhone" name="phone"
                         [(ngModel)]="phone" placeholder="XX XXX XXX"
                         inputmode="numeric" maxlength="8" pattern="\d*"
                         (input)="onPhoneInput($event, 'phone')"
                         [disabled]="phoneVerified" required>
                </div>
              </div>
              <button type="button" class="fb-btn-verify" (click)="sendOtp()"
                      [disabled]="otpStatus === 'sending' || phoneVerified">
                {{ phoneVerified ? 'Vérifié ✓' : (otpStatus === 'sending' ? 'Envoi…' : (otpRequested ? 'Renvoyer' : 'Vérifier')) }}
              </button>
            </div>

            <!-- OTP code input appears after send -->
            <div *ngIf="otpRequested && !phoneVerified" class="fb-phone-row" style="margin-top:10px;">
              <div class="fb-field" style="margin-bottom:0">
                <div class="fb-input">
                  <span class="material-icons-outlined icon">pin</span>
                  <input type="text" name="otpCode" [(ngModel)]="otpCode"
                         placeholder="Code reçu par SMS" inputmode="numeric" maxlength="6">
                </div>
              </div>
              <button type="button" class="fb-btn-verify" (click)="verifyOtp()"
                      [disabled]="otpStatus === 'verifying'">
                {{ otpStatus === 'verifying' ? '…' : 'Valider' }}
              </button>
            </div>

            <div *ngIf="otpError" class="fb-strength-text" style="color:#ef4444;margin-top:6px;">{{ otpError }}</div>
            <div *ngIf="phoneVerified" class="fb-strength-text" style="color:#22c55e;margin-top:6px;">Numéro vérifié avec succès.</div>
          </div>

          <div *ngIf="errorMsg" class="alert alert-danger py-2 mt-3" role="alert"
               style="font-size:13px;border-radius:10px;">{{ errorMsg }}</div>

          <button type="submit" class="fb-btn" [disabled]="submitting">
            {{ submitting ? 'Création…' : 'Créer la famille' }}
          </button>
        </form>

        <div class="fb-footer">
          Déjà un compte ? <a routerLink="/auth/login">Se connecter</a>
        </div>

      </div>
    </div>
  </div>
