<!doctype html>
<html lang="fr" data-bs-theme="blue-theme">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>FamilyBalance</title>

  <link rel="icon" href="/assets/images/app-logo.jpeg" type="image/jpeg">

  <!-- loader -->
  <link href="/assets/css/pace.min.css" rel="stylesheet">
  <script src="/assets/js/pace.min.js"></script>

  <!-- plugins css -->
  <link href="/assets/plugins/perfect-scrollbar/css/perfect-scrollbar.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="/assets/plugins/metismenu/metisMenu.min.css">
  <link rel="stylesheet" type="text/css" href="/assets/plugins/metismenu/mm-vertical.css">
  <link rel="stylesheet" type="text/css" href="/assets/plugins/simplebar/css/simplebar.css">

  <!-- bootstrap css -->
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- extended + icons -->
  <link href="/assets/css/bootstrap-extended.css" rel="stylesheet">
  <link href="/assets/css/extra-icons.css" rel="stylesheet">

  <!-- theme css -->
  <link href="/sass/main.css" rel="stylesheet">
  <link href="/sass/dark-theme.css" rel="stylesheet">
  <link href="/sass/blue-theme.css" rel="stylesheet">
  <link href="/sass/semi-dark.css" rel="stylesheet">
  <link href="/sass/bordered-theme.css" rel="stylesheet">
  <link href="/sass/responsive.css" rel="stylesheet">

  <!-- FamilyBalance shared UI consistency styles -->
  <style>
    .btn-grd-primary, .btn-grd.btn-grd-primary {
      background: linear-gradient(135deg, #377CF4, #2E3F8F) !important;
      border: none !important; color: #fff !important;
    }
    .btn-grd-primary:hover { background: linear-gradient(135deg, #2E6BE0, #26336F)!important; }

    .btn-grd-success, .btn-grd.btn-grd-success {
      background: linear-gradient(135deg,#16a34a,#22c55e)!important;
      border:none!important; color:#fff!important;
    }
    .btn-grd-success:hover { background: linear-gradient(135deg,#15803d,#16a34a)!important; }

    .btn-grd-danger, .btn-grd.btn-grd-danger {
      background: linear-gradient(135deg,#dc2626,#ef4444)!important;
      border:none!important; color:#fff!important;
    }

    .btn-grd-warning, .btn-grd.btn-grd-warning {
      background: linear-gradient(135deg,#d97706,#f59e0b)!important;
      border:none!important; color:#fff!important;
    }

    .btn-grd-info, .btn-grd.btn-grd-info {
      background: linear-gradient(135deg,#0891b2,#06b6d4)!important;
      border:none!important; color:#fff!important;
    }

    .btn-outline-primary { border-color:#2E3F8F!important; color:#2E3F8F!important; }
    .btn-outline-primary:hover { background:#2E3F8F!important; color:#fff!important; }
    .btn-outline-success { border-color:#22c55e!important; color:#22c55e!important; }
    .btn-outline-success:hover { background:#22c55e!important; color:#fff!important; }
    .btn-outline-danger  { border-color:#ef4444!important; color:#ef4444!important; }
    .btn-outline-danger:hover  { background:#ef4444!important; color:#fff!important; }
    .btn-outline-warning { border-color:#f59e0b!important; color:#f59e0b!important; }
    .btn-outline-warning:hover { background:#f59e0b!important; color:#fff!important; }
    .btn-outline-info    { border-color:#06b6d4!important; color:#06b6d4!important; }
    .btn-outline-info:hover    { background:#06b6d4!important; color:#fff!important; }

    .badge.bg-primary.bg-opacity-10 { background:rgba(55,124,244,.12)!important; }
    .badge.bg-success.bg-opacity-10 { background:rgba(34,197,94,.12)!important; }
    .badge.bg-danger.bg-opacity-10  { background:rgba(239,68,68,.12)!important; }
    .badge.bg-warning.bg-opacity-10 { background:rgba(245,158,11,.12)!important; }
    .badge.bg-info.bg-opacity-10    { background:rgba(6,182,212,.12)!important; }
    .badge.bg-danger.bg-opacity-15  { background:rgba(239,68,68,.15)!important; }
    .badge.bg-success.bg-opacity-15 { background:rgba(34,197,94,.15)!important; }

    .fb-nav-link.active {
      background: linear-gradient(135deg, #377CF4, #2E3F8F) !important;
      color: white !important;
      box-shadow: 0 4px 16px rgba(55,124,244,.3) !important;
    }

    .bg-grd-primary  { background: linear-gradient(135deg,#377CF4,#2E3F8F)!important; }
    .bg-grd-success  { background: linear-gradient(135deg,#16a34a,#22c55e)!important; }
    .bg-grd-danger   { background: linear-gradient(135deg,#dc2626,#ef4444)!important; }
    .bg-grd-warning  { background: linear-gradient(135deg,#d97706,#f59e0b)!important; }
    .bg-grd-info     { background: linear-gradient(135deg,#0891b2,#06b6d4)!important; }

    .kpi-card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .kpi-card-hover:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.18) !important; }

    /* ── Logo display : forme circulaire + ajustement propre ── */
    .sidebar-wrapper .sidebar-header .logo-img {
      width: 46px !important;
      height: 46px !important;
      object-fit: contain !important;
      border-radius: 50% !important;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      padding: 2px;
    }
    .fb-logo img {
      width: 78px !important;
      height: 78px !important;
      object-fit: contain !important;
      border-radius: 50% !important;
      background: #fff;
      box-shadow: 0 6px 20px rgba(55,124,244,0.18);
      padding: 4px;
    }
  </style>

  <script>
    (function(){var t=localStorage.getItem('fb-theme')||'blue-theme';document.documentElement.setAttribute('data-bs-theme',t);})();
  </script>
</head>
<body>
  <app-root></app-root>

  <!-- Core vendor scripts loaded globally -->
  <script src="/assets/js/bootstrap.bundle.min.js"></script>

  <script src="/assets/plugins/perfect-scrollbar/js/perfect-scrollbar.js"></script>
  <script src="/assets/plugins/metismenu/metisMenu.min.js"></script>
  <script src="/assets/plugins/apexchart/apexcharts.min.js"></script>
  <script src="/assets/plugins/simplebar/js/simplebar.min.js"></script>
  <script src="/assets/plugins/peity/jquery.peity.min.js"></script>
</body>
</html>
